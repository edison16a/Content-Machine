name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could Content Machine help? Keep in mind it never downloads video and never changes audio.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
